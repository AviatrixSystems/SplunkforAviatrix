#
# Aviatrix Technology Add-on - Field Extractions and CIM Compliance
#

#############################################
# L4 Firewall - DCF Micro-segmentation Logs
#############################################
[aviatrix:firewall:l4]
TIME_FORMAT = %s
TIME_PREFIX = "timestamp":"?
MAX_TIMESTAMP_LOOKAHEAD = 20
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
NO_BINARY_CHECK = true
KV_MODE = json
TRUNCATE = 0
category = Network & Security
description = Aviatrix Distributed Cloud Firewall Layer 4 micro-segmentation logs

# CIM Network Traffic Field Aliases
FIELDALIAS-src = src_ip AS src
FIELDALIAS-dest = dst_ip AS dest
FIELDALIAS-dest_port = dst_port AS dest_port
FIELDALIAS-rule = uuid AS rule
FIELDALIAS-dvc_ip = gw_ip AS dvc_ip
FIELDALIAS-dest_mac_addr = dst_mac AS dest_mac

# Calculated Fields
# Session counters arrive as unresolved "%{...}" placeholders on non-session
# events; tonumber() keeps bytes/packets numeric (or null) for CIM.
EVAL-transport = lower(proto)
EVAL-protocol = "ip"
EVAL-bytes = tonumber(session_byte_cnt)
EVAL-packets = tonumber(session_pkt_cnt)
EVAL-duration = if(isnotnull(session_dur), round(tonumber(session_dur)/1000000, 3), null())
EVAL-vendor_product = "Aviatrix Cloud Firewall"
EVAL-vendor = "Aviatrix"
EVAL-product = "Distributed Cloud Firewall"
# Private = RFC1918 plus 100.64.0.0/10 (CGNAT, common for EKS/AKS pod CIDRs)
EVAL-direction = case(match(src_ip, "^10\.|^172\.(1[6-9]|2[0-9]|3[0-1])\.|^192\.168\.|^100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.") AND match(dst_ip, "^10\.|^172\.(1[6-9]|2[0-9]|3[0-1])\.|^192\.168\.|^100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\."), "internal", match(src_ip, "^10\.|^172\.(1[6-9]|2[0-9]|3[0-1])\.|^192\.168\.|^100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\."), "outbound", 1=1, "inbound")
EVAL-dvc = coalesce(host, gw_ip)

# CIM action normalization (Network_Traffic: allowed|blocked|teardown).
# Calculated fields are evaluated in parallel against the extracted values, so
# both EVALs below see the raw vendor action. vendor_action preserves it.
EVAL-vendor_action = action
# A deny from a rule in monitor mode (enforced=false) is logged but the traffic
# is not dropped, so the CIM outcome is "allowed". action_cim keeps the policy
# verdict (blocked) for policy analysis.
EVAL-action = case(match(lower(action), "^(permit|allow|allowed|accept)$"), "allowed", match(lower(action), "^(deny|drop|block|blocked|reject)$") AND lower(enforced)=="false", "allowed", match(lower(action), "^(deny|drop|block|blocked|reject)$"), "blocked", 1=1, lower(action))

# action_cim: the normalized policy verdict (DENY -> blocked even when not enforced).
LOOKUP-action_l4 = aviatrix_action_lookup action AS vendor_action OUTPUT action_cim

# Enforcement mode of the matching rule: enforced or monitor (logged, not dropped).
EVAL-policy_mode = if(lower(enforced)=="false", "monitor", "enforced")

# 8.2+ gateways log a session start (SESSION_EVENT=0) and a session end
# (SESSION_EVENT=1, with packet/byte/duration counters) per flow. Older gateways
# and the first packet of a flow log a single event with no SESSION_* fields;
# the connector then sends the literal "%{session_event}". session_phase lets
# searches count each flow once (session_phase!="end") and read counters from
# end events only.
EVAL-session_phase = case(session_event=="0", "start", session_event=="1", "end", 1=1, "none")
EVAL-session_id = if(match(session_id, "^%\{"), null(), session_id)
EVAL-session_end_reason = if(match(session_end_reason, "^%\{"), null(), session_end_reason)
LOOKUP-session_end_reason = aviatrix_session_end_reason_lookup session_end_reason OUTPUT reason_description AS session_end_description

#############################################
# L7 Firewall - TLS/SNI Inspection Logs
#############################################
[aviatrix:firewall:l7]
TIME_FORMAT = %s
TIME_PREFIX = "timestamp":
MAX_TIMESTAMP_LOOKAHEAD = 20
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
NO_BINARY_CHECK = true
KV_MODE = json
TRUNCATE = 0
category = Network & Security
description = Aviatrix Distributed Cloud Firewall Layer 7 TLS/SNI inspection logs

# CIM Network Traffic Field Aliases
FIELDALIAS-src_ip = src AS src_ip
FIELDALIAS-dest_ip = dest AS dest_ip
FIELDALIAS-rule = decided_by AS rule
EVAL-protocol = "ip"
FIELDALIAS-app = sni_hostname AS app
FIELDALIAS-url_domain = sni_hostname AS url_domain

# Calculated Fields
EVAL-bytes = if(isnotnull(request_bytes) AND isnotnull(response_bytes), tonumber(request_bytes) + tonumber(response_bytes), null())
EVAL-bytes_in = response_bytes
EVAL-bytes_out = request_bytes
EVAL-duration = if(isnotnull(session_time), round(tonumber(session_time)/1000000000, 3), null())
EVAL-vendor_product = "Aviatrix Cloud Firewall"
EVAL-vendor = "Aviatrix"
EVAL-product = "Distributed Cloud Firewall"
EVAL-dvc = host

# CIM action normalization (Network_Traffic: allowed|blocked|teardown).
# Calculated fields are evaluated in parallel against the extracted values, so
# both EVALs below see the raw vendor action. vendor_action preserves it.
EVAL-vendor_action = action
# A deny from a rule in monitor mode (enforced=false) is logged but the traffic
# is not dropped, so the CIM outcome is "allowed". action_cim keeps the policy
# verdict (blocked) for policy analysis.
EVAL-action = case(match(lower(action), "^(permit|allow|allowed|accept)$"), "allowed", match(lower(action), "^(deny|drop|block|blocked|reject)$") AND lower(enforced)=="false", "allowed", match(lower(action), "^(deny|drop|block|blocked|reject)$"), "blocked", 1=1, lower(action))

# action_cim: the normalized policy verdict (DENY -> blocked even when not enforced).
LOOKUP-action_l7 = aviatrix_action_lookup action AS vendor_action OUTPUT action_cim

# Gateways send proto as "TCP" or "tcp"; CIM transport is lower case.
EVAL-transport = lower(proto)
EVAL-policy_mode = if(lower(enforced)=="false", "monitor", "enforced")
# Each L7 session logs a "start" event carrying the policy verdict and an "end"
# event carrying byte counts and, on 8.2+, the inline IDS/IPS outcome:
#   IPS_POLICY_DENY     Suricata signature matched and the session was dropped
#   IDS_POLICY_ALERT    Suricata signature matched, alert only
#   IDS_POLICY_TIMEOUT  Suricata unavailable, traffic permitted uninspected
#   CONNECTION_SYN_ONLY_TIMEOUT  TCP handshake stalled (server-speaks-first protocols)
# l7_event_class groups these so searches count verdicts on start events only.
EVAL-l7_event_class = case(match(reason, "^IPS_"), "ips_block", match(reason, "^IDS_POLICY_ALERT"), "ids_alert", match(reason, "^IDS_POLICY_TIMEOUT"), "ids_timeout", reason=="TLS_PROFILE", "tls_inspection", match(reason, "TIMEOUT"), "connection_timeout", session_stage=="end", "session_end", 1=1, "verdict")
EVAL-signature_id = tonumber(sid)

#############################################
# IDS - Suricata EVE Format
#############################################
[aviatrix:ids]
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6N%z
TIME_PREFIX = "timestamp":"
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
NO_BINARY_CHECK = true
KV_MODE = json
TRUNCATE = 0
category = Network & Security
description = Aviatrix IDS (Suricata) intrusion detection alerts

# CIM Intrusion Detection Field Aliases
FIELDALIAS-src = src_ip AS src
FIELDALIAS-dest = dest_ip AS dest
EVAL-transport = lower(proto)
EVAL-protocol = "ip"

# Raw EVE JSON nests alert fields under alert.*; flatten to the field names
# the dashboards and lookups use. ASNEW (not AS) is required: AS removes the
# destination field when the nested source is absent, which would wipe the
# flat fields on legacy pre-flattened events.
FIELDALIAS-alert_signature = "alert.signature" ASNEW signature
FIELDALIAS-alert_signature_id = "alert.signature_id" ASNEW signature_id
FIELDALIAS-alert_severity = "alert.severity" ASNEW severity
FIELDALIAS-alert_category = "alert.category" ASNEW category
FIELDALIAS-alert_action = "alert.action" ASNEW action
FIELDALIAS-ids_signature = signature AS ids_signature
FIELDALIAS-ids_signature_nested = "alert.signature" ASNEW ids_signature
FIELDALIAS-ids_signature_id = signature_id AS ids_signature_id
FIELDALIAS-ids_signature_id_nested = "alert.signature_id" ASNEW ids_signature_id
FIELDALIAS-ids_category = category AS ids_category
FIELDALIAS-ids_category_nested = "alert.category" ASNEW ids_category

# HTTP-specific aliases for Suricata HTTP fields (nested http.* and legacy flat)
FIELDALIAS-http_method_nested = "http.http_method" ASNEW http_method
FIELDALIAS-http_url_nested = "http.url" ASNEW http_url
FIELDALIAS-http_hostname_nested = "http.hostname" ASNEW http_hostname
FIELDALIAS-http_user_agent_nested = "http.http_user_agent" ASNEW http_user_agent
FIELDALIAS-http_status_nested = "http.status" ASNEW http_status
FIELDALIAS-http_uri = http_url AS url
FIELDALIAS-http_uri_nested = "http.url" ASNEW url
FIELDALIAS-http_host = http_hostname AS url_domain
FIELDALIAS-http_host_nested = "http.hostname" ASNEW url_domain
FIELDALIAS-http_status_cim = http_status AS status
FIELDALIAS-http_status_cim_nested = "http.status" ASNEW status

# Flow fields (nested flow.* and legacy flat)
FIELDALIAS-bytes_in = flow_bytes_toclient AS bytes_in
FIELDALIAS-bytes_in_nested = "flow.bytes_toclient" ASNEW bytes_in
FIELDALIAS-bytes_out = flow_bytes_toserver AS bytes_out
FIELDALIAS-bytes_out_nested = "flow.bytes_toserver" ASNEW bytes_out

# Calculated Fields
EVAL-vendor_product = "Aviatrix IDS (Suricata)"
EVAL-vendor = "Aviatrix"
EVAL-product = "Suricata IDS"
EVAL-ids_type = "network"
EVAL-dvc = host
# CIM Intrusion_Detection expects severity as critical|high|medium|low|informational.
# Suricata's numeric priority (1-4) is kept in severity_id.
EVAL-severity_id = tonumber(severity)
EVAL-severity = case(tonumber(severity)==1, "critical", tonumber(severity)==2, "high", tonumber(severity)==3, "medium", tonumber(severity)==4, "low", isnull(severity), null(), 1=1, "informational")
EVAL-severity_name = case(tonumber(severity)==1, "critical", tonumber(severity)==2, "high", tonumber(severity)==3, "medium", tonumber(severity)==4, "low", isnull(severity), null(), 1=1, "informational")

# Application protocol and TLS SNI (nested EVE and the connector's flattened form)
FIELDALIAS-app_proto = app_proto AS app
FIELDALIAS-tls_sni_nested = "tls.sni" ASNEW tls_sni
# ET Open/Pro rule metadata: MITRE ATT&CK mapping and the vendor's own severity.
# Nested EVE carries one-element arrays (alert.metadata.x{}); the connector's
# FLATTEN_SURICATA mode emits meta_x.
EVAL-mitre_tactic_id = mvindex(coalesce('alert.metadata.mitre_tactic_id{}', meta_mitre_tactic_id), 0)
EVAL-mitre_tactic = replace(mvindex(coalesce('alert.metadata.mitre_tactic_name{}', meta_mitre_tactic_name), 0), "_", " ")
EVAL-mitre_technique_id = mvindex(coalesce('alert.metadata.mitre_technique_id{}', meta_mitre_technique_id), 0)
EVAL-mitre_technique = replace(mvindex(coalesce('alert.metadata.mitre_technique_name{}', meta_mitre_technique_name), 0), "_", " ")
EVAL-signature_severity = mvindex(coalesce('alert.metadata.signature_severity{}', meta_signature_severity), 0)

#############################################
# FQDN Filtering Logs (DEPRECATED)
#############################################
# Legacy FQDN egress filter logs. Deprecated in TA 2.2.0 in favor of the
# Distributed Cloud Firewall (L4 + L7) and kept only so existing data still
# parses; removal is planned for 3.0. The Aviatrix Security app no longer
# shows this sourcetype.
[aviatrix:firewall:fqdn]
TIME_FORMAT = %s
TIME_PREFIX = "timestamp":"
MAX_TIMESTAMP_LOOKAHEAD = 20
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
NO_BINARY_CHECK = true
KV_MODE = json
TRUNCATE = 0
category = Network & Security
description = DEPRECATED: Aviatrix legacy FQDN egress filtering logs (use DCF L7)

# CIM Network Traffic Field Aliases
FIELDALIAS-src = sip AS src
FIELDALIAS-src_ip = sip AS src_ip
FIELDALIAS-dest = dip AS dest
FIELDALIAS-dest_ip = dip AS dest_ip
FIELDALIAS-url_domain = hostname AS url_domain
FIELDALIAS-app = hostname AS app
FIELDALIAS-dvc = gateway AS dvc

# Calculated Fields
EVAL-vendor_product = "Aviatrix Cloud Firewall"
EVAL-vendor = "Aviatrix"
EVAL-product = "FQDN Egress Filter"
# A hostname that matches a deny (blacklist) rule logs state=MATCHED together
# with drop_reason=BLACKLISTED, so state alone is not the outcome. The
# connector does not forward drop_reason as a field; read it from the syslog text.
EXTRACT-drop_reason = drop_reason=(?<drop_reason>[A-Z_]+) in syslog
EXTRACT-fqdn_rule = \sRule=(?<fqdn_rule>\S+) in syslog
EVAL-action = if(state=="MATCHED" AND isnull(drop_reason), "allowed", "blocked")
EVAL-vendor_action = coalesce(drop_reason, state)
EVAL-rule = coalesce(if(match(rule, "^%\{"), null(), rule), fqdn_rule)

#############################################
# Gateway Network Statistics
#############################################
[aviatrix:gateway:network]
TIME_FORMAT = %s
TIME_PREFIX = "timestamp":"?
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
NO_BINARY_CHECK = true
KV_MODE = json
TRUNCATE = 0
category = Network & Security
description = Aviatrix Gateway network performance statistics

# CIM Field Aliases
FIELDALIAS-dvc = gateway AS dvc
FIELDALIAS-dest_ip = private_ip AS dest_ip

# Fields the gateway omits (alias on the controller, public_ip on FireNet
# interfaces, conntrack_* on older releases) arrive as literal "%{field}"
# placeholders from the connector. Null them so stats and coalesce() work.
EVAL-alias = if(match(alias, "^%\{"), null(), alias)
EVAL-public_ip = if(match(public_ip, "^%\{"), null(), public_ip)
EVAL-dvc_ip = if(match(public_ip, "^%\{"), null(), public_ip)
EVAL-conntrack_usage_rate = if(match(conntrack_usage_rate, "^%\{"), null(), tonumber(conntrack_usage_rate))
EVAL-conntrack_allowance_available = if(match(conntrack_allowance_available, "^%\{"), null(), tonumber(conntrack_allowance_available))

# Calculated Fields
EVAL-vendor_product = "Aviatrix Gateway"
EVAL-vendor = "Aviatrix"
EVAL-product = "Gateway"

# Rates: the connector's total_rx_rate/total_tx_rate fields lose their unit and
# decimals ("80.33Mb" arrives as "80"), so parse the original syslog text.
EXTRACT-rx_rate = total_rx_rate=(?<rx_rate_value>[\d.]+)(?<rx_rate_unit>[KMG]?b)\b in syslog
EXTRACT-tx_rate = total_tx_rate=(?<tx_rate_value>[\d.]+)(?<tx_rate_unit>[KMG]?b)\b in syslog
# rx_kbps/tx_kbps: rate in Kb/s. thruput_in/out: rate in b/s (1024-based, as in 2.0.x).
EVAL-rx_kbps = round(tonumber(rx_rate_value) * case(rx_rate_unit=="Gb", 1048576, rx_rate_unit=="Mb", 1024, rx_rate_unit=="Kb", 1, rx_rate_unit=="b", 1/1024), 2)
EVAL-tx_kbps = round(tonumber(tx_rate_value) * case(tx_rate_unit=="Gb", 1048576, tx_rate_unit=="Mb", 1024, tx_rate_unit=="Kb", 1, tx_rate_unit=="b", 1/1024), 2)
EVAL-thruput_in = round(tonumber(rx_rate_value) * case(rx_rate_unit=="Gb", 1073741824, rx_rate_unit=="Mb", 1048576, rx_rate_unit=="Kb", 1024, rx_rate_unit=="b", 1))
EVAL-thruput_out = round(tonumber(tx_rate_value) * case(tx_rate_unit=="Gb", 1073741824, tx_rate_unit=="Mb", 1048576, tx_rate_unit=="Kb", 1024, tx_rate_unit=="b", 1))

#############################################
# Gateway System Statistics
#############################################
[aviatrix:gateway:system]
TIME_FORMAT = %s
TIME_PREFIX = "timestamp":"?
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
NO_BINARY_CHECK = true
KV_MODE = json
TRUNCATE = 0
category = Network & Security
description = Aviatrix Gateway system health statistics (CPU, memory, disk)

# CIM Field Aliases
FIELDALIAS-dvc = gateway AS dvc

# Calculated Fields
EVAL-vendor_product = "Aviatrix Gateway"
EVAL-vendor = "Aviatrix"
EVAL-product = "Gateway"
EVAL-cpu_load_percent = 100 - tonumber(cpu_idle)
# Raw memory/disk values are KB; CIM Performance expects MB.
EVAL-mem = round(tonumber(memory_total) / 1024, 2)
EVAL-mem_used = round((tonumber(memory_total) - tonumber(memory_available)) / 1024, 2)
EVAL-mem_free = round(tonumber(memory_available) / 1024, 2)
EVAL-storage = round(tonumber(disk_total) / 1024, 2)
EVAL-storage_used = round((tonumber(disk_total) - tonumber(disk_free)) / 1024, 2)
EVAL-storage_free = round(tonumber(disk_free) / 1024, 2)
EVAL-storage_used_percent = round((tonumber(disk_total) - tonumber(disk_free)) / tonumber(disk_total) * 100, 2)
EVAL-mem_used_percent = round((tonumber(memory_total) - tonumber(memory_available)) / tonumber(memory_total) * 100, 2)
# Controller events have no alias or per-core data; the connector sends "%{field}".
EVAL-alias = if(match(alias, "^%\{"), null(), alias)
EVAL-cpu_core_count = if(match(cpu_core_count, "^%\{"), null(), tonumber(cpu_core_count))
EVAL-cpu_busy_max = if(match(cpu_aggregate_busy_max, "^%\{"), null(), tonumber(cpu_aggregate_busy_max))

#############################################
# Tunnel Status Changes
#############################################
[aviatrix:tunnel:status]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
NO_BINARY_CHECK = true
KV_MODE = json
TRUNCATE = 0
category = Network & Security
description = Aviatrix gateway tunnel up/down state changes

# src_gw/dst_gw look like "k8s-transit(AWS us-east-2)" or, for an external
# peer, "<peer-ip>(NA NA)". The connector's host is an unresolved
# "%{gateway}", so dvc comes from src_gw.
EXTRACT-tunnel_src = ^(?<src_gw_name>[^(]+)\((?<src_cloud>\S+) (?<src_region>[^)]+)\) in src_gw
EXTRACT-tunnel_dst = ^(?<dst_gw_name>[^(]+)\((?<dst_cloud>\S+) (?<dst_region>[^)]+)\) in dst_gw
EVAL-dvc = src_gw_name
EVAL-dest = dst_gw_name
EVAL-tunnel = src_gw_name . " <> " . dst_gw_name
EVAL-status = lower(new_state)
EVAL-vendor_product = "Aviatrix Gateway"
EVAL-vendor = "Aviatrix"
EVAL-product = "Gateway"

#############################################
# Controller Audit Logs
#############################################
[aviatrix:controller:audit]
TIME_FORMAT = %s
TIME_PREFIX = "timestamp":"
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
NO_BINARY_CHECK = true
KV_MODE = json
TRUNCATE = 0
category = Network & Security
description = Aviatrix Controller API audit logs

# CIM Change Analysis
# action (raw) is the API command: a legacy CMD name (EDIT_GW_CONFIG) or a REST
# URL (/v2.5/microseg/policy-list3/<id>? host=... ip=...). It is kept in
# command/vendor_action, and action becomes the CIM verb.
EXTRACT-audit_method = AviatrixAPI: method=(?<http_method>[A-Z]+) in syslog
EXTRACT-audit_src = AviatrixAPI: .*? ip=(?<src>\d{1,3}(?:\.\d{1,3}){3}) in syslog
EXTRACT-audit_operation = '(?:action|operation)', '(?<command_operation>[^']+)' in args
EXTRACT-audit_login_ip = '--login_ip', '(?<src>[^']+)' in args

EVAL-vendor_action = action
EVAL-command = action
EVAL-action = case(isnotnull(http_method), case(http_method=="POST", "created", http_method=="DELETE", "deleted", http_method=="PUT" OR http_method=="PATCH", "modified", http_method=="GET", "read", 1=1, "unknown"), match(lower(command_operation), "^(get|list|show|is_|check|test|diag|query|fetch)") OR match(args, "^\\['--rtn_file', '[^']*', '[a-z_]+', '(get|list|show|is)_") OR match(action, "(^|_)(GET|LIST|SHOW|DIAG|TEST)(_|$)"), "read", match(lower(command_operation), "^(delete|del|remove|detach|leave|disconnect)") OR match(action, "^(DELETE|DEL|REMOVE|TERMINATE|UNPEER|DETACH)_|_(LEAVE|DISCONNECT)(_|$)"), "deleted", match(lower(command_operation), "^(create|add|attach|join)") OR match(action, "^(CREATE|ADD|PEER|ATTACH)_|_(JOIN|CONNECT)(_|$)"), "created", match(action, "^(EDIT|UPDATE|MODIFY|SET|SETUP|ENABLE|DISABLE|MANAGE|MIGRATE|USERCONNECT)_|(_|^)(CONFIG|FEATURE|SERVICE|ACTION|PEERING|UPGRADE)(_|$)"), "modified", 1=1, "unknown")
EVAL-object = if(match(action, "^/"), replace(replace(replace(action, "[ ?].*$", ""), "^/v[0-9.]+/", ""), "/([0-9a-fA-F]{8}-[0-9a-fA-F-]{27}|[0-9a-fA-F]{24})$", ""), lower(action))
EVAL-object_id = if(match(replace(action, "[ ?].*$", ""), "^/.*/([0-9a-fA-F]{8}-[0-9a-fA-F-]{27}|[0-9a-fA-F]{24})$"), replace(replace(action, "[ ?].*$", ""), "^.*/", ""), null())
EVAL-object_category = if(match(action, "^/"), replace(replace(action, "[ ?].*$", ""), "^/v[0-9.]+/([^/]+).*$", "\1"), case(match(action, "USER|LOGIN|SAML|ACCOUNT|CUSTOMER"), "user", match(action, "FIRENET"), "firenet", match(action, "BGP"), "bgp", match(action, "TRANSIT|SPOKE"), "transit", match(action, "GATEWAY|_GW"), "gateway", match(action, "VPC|PEER"), "vpc", match(action, "RSYSLOG|CONTROLLER|FEATURE|MIGRATE|UPGRADE"), "controller", 1=1, "other"))
EVAL-change_type = case(match(action, "USER|LOGIN|SAML|ACCOUNT|CUSTOMER"), "AAA", match(action, "RSYSLOG|CONTROLLER|FEATURE|MIGRATE|UPGRADE|SERVICE"), "application", 1=1, "network")
# Some connector releases send host as an unresolved "%{gw_hostname}"; the
# controller name is always in the syslog text.
EXTRACT-audit_controller = (?<controller>Controller-\d{1,3}(?:\.\d{1,3}){3}) in syslog
EVAL-dest = coalesce(controller, if(match(host, "^%\{"), null(), host))
EVAL-vendor_product = "Aviatrix Controller"
EVAL-vendor = "Aviatrix"
EVAL-product = "Controller"
EVAL-dvc = coalesce(controller, if(match(host, "^%\{"), null(), host))
# Controller error code and message from failed V2.5 API calls, e.g.
# {"message": "[AVXERR-DFW-0004] Malformed JSON input: ..."}
EXTRACT-audit_error = \[(?<error_code>AVXERR-[A-Z0-9]+-\d+)\]\s*(?<error_message>[^"\}]{1,200}) in reason
# username is the literal "%{username}" when the connector couldn't parse it
EVAL-user = if(isnull(username) OR match(username, "^%\{"), "unknown", username)
# CIM Change: status must be success|failure. Legacy API results are
# "Success"/"Fail"; REST results are HTTP status lines ("201 CREATED").
EVAL-status = if(result=="Success" OR match(result, "^2\d\d"), "success", "failure")
EVAL-result_status = if(result=="Success" OR match(result, "^2\d\d"), "success", "failure")

#############################################
# User VPN Sessions
#############################################
[aviatrix:vpn:session]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
NO_BINARY_CHECK = true
KV_MODE = json
TRUNCATE = 0
category = Network & Security
description = Aviatrix User VPN (OpenVPN) session connect and disconnect events

# The connector's pre-parsed vpn_* fields carry unresolved "%{...}" placeholders
# when a value is empty (GatewayIP usually is), so the CIM fields are parsed
# from the AviatrixVPNSession text in _raw, which holds
# that text both in the connector's JSON (its "syslog" field) and when the
# plain syslog line is sent with this sourcetype. The IP patterns skip "N/A".
EXTRACT-vpn_user = AviatrixVPNSession: User=(?<user>[^,]+),
EXTRACT-vpn_session_status = AviatrixVPNSession: User=[^,]*, Status=(?<vpn_session_status>\w+)
EXTRACT-vpn_dvc = AviatrixVPNSession: .*?, Gateway=(?<dvc>[^,\s]+),
EXTRACT-vpn_dvc_ip = AviatrixVPNSession: .*?, GatewayIP=(?<dvc_ip>\d{1,3}(?:\.\d{1,3}){3}),
EXTRACT-vpn_dest_ip = AviatrixVPNSession: .*?, VPNVirtualIP=(?<dest_ip>\d{1,3}(?:\.\d{1,3}){3}),
EXTRACT-vpn_src_ip = AviatrixVPNSession: .*?, PublicIP=(?<src_ip>\d{1,3}(?:\.\d{1,3}){3}),
EXTRACT-vpn_session_login = AviatrixVPNSession: .*?, Login=(?<vpn_session_login>\d{4}-\d\d-\d\d \d\d:\d\d:\d\d),
# Duration is D:H:M:S, and RXbytes/TXbytes are human units ("8.7KB", "2.1 MB").
# All three are "N/A" on connect events.
EXTRACT-vpn_duration = AviatrixVPNSession: .*?, Duration=(?<vpn_duration_d>\d+):(?<vpn_duration_h>\d+):(?<vpn_duration_m>\d+):(?<vpn_duration_s>\d+),
EXTRACT-vpn_rx = AviatrixVPNSession: .*?, RXbytes=(?<vpn_rx_value>[\d.]+)\s*(?<vpn_rx_unit>[KMGTkmgt]?[Bb]),
EXTRACT-vpn_tx = AviatrixVPNSession: .*?, TXbytes=(?<vpn_tx_value>[\d.]+)\s*(?<vpn_tx_unit>[KMGTkmgt]?[Bb]),

FIELDALIAS-src = src_ip AS src

# CIM Network_Sessions (tags network session vpn, plus start or end) for every
# event, and Authentication (tag authentication) for connect events.
# Authentication needs action=success on connect; Network_Sessions keys
# Session_Start/Session_End on tags, so disconnects use its "deleted" value.
# vendor_action keeps the raw status (active|disconnected).
EVAL-vendor_action = vpn_session_status
EVAL-action = case(vpn_session_status=="active", "success", vpn_session_status=="disconnected", "deleted", 1=1, lower(vpn_session_status))
EVAL-app = "aviatrix:vpn"
EVAL-signature = case(vpn_session_status=="active", "VPN session started", vpn_session_status=="disconnected", "VPN session ended", 1=1, "VPN session " . vpn_session_status)
EVAL-dest = dvc
EVAL-duration = if(isnotnull(vpn_duration_s), tonumber(vpn_duration_d)*86400 + tonumber(vpn_duration_h)*3600 + tonumber(vpn_duration_m)*60 + tonumber(vpn_duration_s), null())
# RX is what the gateway received from the client (bytes_in), TX what it sent
# to the client (bytes_out). Units are 1024-based.
EVAL-bytes_in = round(tonumber(vpn_rx_value) * case(upper(vpn_rx_unit)=="TB", 1099511627776, upper(vpn_rx_unit)=="GB", 1073741824, upper(vpn_rx_unit)=="MB", 1048576, upper(vpn_rx_unit)=="KB", 1024, upper(vpn_rx_unit)=="B", 1))
EVAL-bytes_out = round(tonumber(vpn_tx_value) * case(upper(vpn_tx_unit)=="TB", 1099511627776, upper(vpn_tx_unit)=="GB", 1073741824, upper(vpn_tx_unit)=="MB", 1048576, upper(vpn_tx_unit)=="KB", 1024, upper(vpn_tx_unit)=="B", 1))
EVAL-bytes = round(tonumber(vpn_rx_value) * case(upper(vpn_rx_unit)=="TB", 1099511627776, upper(vpn_rx_unit)=="GB", 1073741824, upper(vpn_rx_unit)=="MB", 1048576, upper(vpn_rx_unit)=="KB", 1024, upper(vpn_rx_unit)=="B", 1) + tonumber(vpn_tx_value) * case(upper(vpn_tx_unit)=="TB", 1099511627776, upper(vpn_tx_unit)=="GB", 1073741824, upper(vpn_tx_unit)=="MB", 1048576, upper(vpn_tx_unit)=="KB", 1024, upper(vpn_tx_unit)=="B", 1))
EVAL-vendor_product = "Aviatrix User VPN"
EVAL-vendor = "Aviatrix"
EVAL-product = "User VPN"

#############################################
# HEC Raw Events (fallback parsing)
#############################################
[aviatrix:hec]
TIME_FORMAT = %s
TIME_PREFIX = "timestamp":
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
NO_BINARY_CHECK = true
KV_MODE = json
TRUNCATE = 0
category = Network & Security
description = Aviatrix HEC raw events (pre-routing)
