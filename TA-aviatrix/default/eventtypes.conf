#
# Aviatrix Technology Add-on - Event Types
#

#############################################
# Firewall Traffic Events
#############################################
[aviatrix_firewall_traffic]
search = (sourcetype="aviatrix:firewall:l4" OR sourcetype="aviatrix:firewall:l7" OR sourcetype="aviatrix:firewall:fqdn")

[aviatrix_firewall_l4]
search = sourcetype="aviatrix:firewall:l4"

[aviatrix_firewall_l7]
search = sourcetype="aviatrix:firewall:l7"

[aviatrix_fqdn]
search = sourcetype="aviatrix:firewall:fqdn"

#############################################
# Traffic by Action
#############################################
[aviatrix_traffic_allowed]
search = (sourcetype="aviatrix:firewall:l4" OR sourcetype="aviatrix:firewall:l7" OR sourcetype="aviatrix:firewall:fqdn") action="allowed"

[aviatrix_traffic_blocked]
search = (sourcetype="aviatrix:firewall:l4" OR sourcetype="aviatrix:firewall:l7" OR sourcetype="aviatrix:firewall:fqdn") action="blocked"

#############################################
# IDS Events
#############################################
[aviatrix_ids_alert]
search = sourcetype="aviatrix:ids" event_type="alert"

[aviatrix_ids_critical]
search = sourcetype="aviatrix:ids" event_type="alert" severity_id=1

[aviatrix_ids_high]
search = sourcetype="aviatrix:ids" event_type="alert" severity_id=2

#############################################
# Gateway Performance Events
#############################################
[aviatrix_gateway_network]
search = sourcetype="aviatrix:gateway:network"

[aviatrix_gateway_system]
search = sourcetype="aviatrix:gateway:system"

[aviatrix_gateway_health]
search = (sourcetype="aviatrix:gateway:network" OR sourcetype="aviatrix:gateway:system")

#############################################
# Audit Events
#############################################
[aviatrix_audit]
search = sourcetype="aviatrix:controller:audit"

[aviatrix_audit_success]
search = sourcetype="aviatrix:controller:audit" status="success"

[aviatrix_audit_failure]
search = sourcetype="aviatrix:controller:audit" status="failure"

[aviatrix_audit_policy_change]
search = sourcetype="aviatrix:controller:audit" (command="*microseg*" OR command="*policy*" OR command="*rule*" OR command="*app-domains*" OR command="*firenet*")

#############################################
# User VPN Session Events
#############################################
[aviatrix_vpn_session]
search = sourcetype="aviatrix:vpn:session"

[aviatrix_vpn_session_start]
search = sourcetype="aviatrix:vpn:session" vendor_action="active"

[aviatrix_vpn_session_end]
search = sourcetype="aviatrix:vpn:session" vendor_action="disconnected"

#############################################
# Tunnel and Inline L7 IDS/IPS Events
#############################################
[aviatrix_tunnel_status]
search = sourcetype="aviatrix:tunnel:status"

[aviatrix_tunnel_down]
search = sourcetype="aviatrix:tunnel:status" new_state="Down"

# 8.2+ L7 session-end events where the inline Suricata engine matched a signature
[aviatrix_l7_threat]
search = sourcetype="aviatrix:firewall:l7" (reason="IPS_POLICY_DENY" OR reason="IDS_POLICY_ALERT")
