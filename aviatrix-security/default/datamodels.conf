#
# Aviatrix Security - Data Models
#
# Aviatrix_Traffic normalizes Distributed Cloud Firewall flows (L4 + L7; one
# event per connection) for the Overview, Traffic Analysis and L7 Firewall dashboards,
# which query it with tstats summariesonly=false: results are always complete,
# and raw events fill any time range that is not summarized.
#
# Acceleration is off by default. Turn it on for fast dashboards over long
# time ranges (weeks to a year): Settings > Data models > Aviatrix Traffic >
# Edit > Edit Acceleration, check Accelerate and pick a Summary Range (for
# example 3 months or 1 year). See the app README for sizing guidance.
#
[Aviatrix_Traffic]
acceleration = 0
acceleration.earliest_time = -1y
acceleration.cron_schedule = */10 * * * *
acceleration.max_concurrent = 2
