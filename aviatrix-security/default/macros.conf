#
# Aviatrix Security - Search Macros
#

#############################################
# Base Data Access Macros
#############################################

[aviatrix_index]
definition = index=main
iseval = 0

# Distributed Cloud Firewall traffic: L4 micro-segmentation and L7 (TLS/SNI).
# Legacy FQDN egress events are deprecated (app 2.2.0) and excluded.
[aviatrix_firewall]
definition = `aviatrix_index` (sourcetype="aviatrix:firewall:l4" OR sourcetype="aviatrix:firewall:l7")
iseval = 0

[aviatrix_l4]
definition = `aviatrix_index` sourcetype="aviatrix:firewall:l4"
iseval = 0

[aviatrix_l7]
definition = `aviatrix_index` sourcetype="aviatrix:firewall:l7"
iseval = 0

# DEPRECATED (app 2.2.0): legacy FQDN egress events. No dashboard uses this
# macro; it is kept for saved searches that still reference it.
[aviatrix_fqdn]
definition = `aviatrix_index` sourcetype="aviatrix:firewall:fqdn"
iseval = 0

[aviatrix_ids]
definition = `aviatrix_index` sourcetype="aviatrix:ids"
iseval = 0

[aviatrix_gateway_network]
definition = `aviatrix_index` sourcetype="aviatrix:gateway:network"
iseval = 0

[aviatrix_gateway_system]
definition = `aviatrix_index` sourcetype="aviatrix:gateway:system"
iseval = 0

[aviatrix_audit]
definition = `aviatrix_index` sourcetype="aviatrix:controller:audit"
iseval = 0

[aviatrix_vpn]
definition = `aviatrix_index` sourcetype="aviatrix:vpn:session"
iseval = 0

#############################################
# Filtered Macros
#############################################

[aviatrix_blocked]
definition = `aviatrix_firewall` (action="blocked" OR (action_cim="blocked" NOT vendor_action=*) OR action="DENY")
iseval = 0

[aviatrix_allowed]
definition = `aviatrix_firewall` (action="allowed" OR (action_cim="allowed" NOT vendor_action=*) OR action="PERMIT")
iseval = 0

[aviatrix_ids_alerts]
definition = `aviatrix_ids` event_type="alert"
iseval = 0

#############################################
# CIM-Compatible Macros
#############################################

[aviatrix_network_traffic]
definition = `aviatrix_firewall` | eval src=coalesce(src_ip, src, sip), dest=coalesce(dst_ip, dest, dip), action=`aviatrix_traffic_action`
iseval = 0

[aviatrix_intrusion_detection]
definition = `aviatrix_ids` event_type="alert" | eval src=src_ip, dest=dest_ip, vendor_product="Aviatrix IDS (Suricata)", ids_type="network", severity_id=coalesce(severity_id, tonumber(severity))
iseval = 0

# Traffic outcome (allowed|blocked) for an eval expression. TA >= 2.0.2 sets
# action to the CIM outcome (monitor-mode denies are allowed) and adds
# vendor_action; older TAs only have action_cim (L4/L7) or action (FQDN).
[aviatrix_traffic_action]
definition = if(isnotnull(vendor_action), action, coalesce(action_cim, action))
iseval = 0

# Normalized audit fields. TA >= 2.0.2: command = API name/URL, action = CIM verb.
# Older TAs: action is the API name and the verb is unknown.
[aviatrix_audit_fields]
definition = eval command=coalesce(command, action), change_action=if(isnotnull(vendor_action), action, "unknown"), object_category=coalesce(object_category, "unknown"), username=if(isnull(username) OR match(username, "^%\{"), "unknown", username), result_status=coalesce(result_status, if(result=="Success" OR match(result, "^2\d\d"), "success", "failure"))
iseval = 0

# Normalized User VPN session fields. TA >= 2.1.0 parses user, src, dest_ip,
# dvc, duration (seconds) and bytes_in/bytes_out (bytes) from the syslog line;
# with older TAs they are derived here from the connector's vpn_* strings.
# session_id ties a connect to its disconnect (same user, gateway and login time).
# vpn_status is active (connect) or disconnected.
[aviatrix_vpn_fields]
definition = eval vpn_status=lower(coalesce(vpn_session_status, vpn_status)), user=coalesce(user, if(isnull(vpn_user) OR match(vpn_user, "^(%\{.*|N/A)?$"), "unknown", vpn_user)), src=coalesce(src, if(match(vpn_public_ip, "^\d{1,3}(\.\d{1,3}){3}$"), vpn_public_ip, null())), dest_ip=coalesce(dest_ip, if(match(vpn_virtual_ip, "^\d{1,3}(\.\d{1,3}){3}$"), vpn_virtual_ip, null())), dvc=coalesce(dvc, vpn_gateway, host), duration=coalesce(duration, if(match(vpn_duration, "^\d+:\d+:\d+:\d+$"), tonumber(mvindex(split(vpn_duration, ":"), 0))*86400 + tonumber(mvindex(split(vpn_duration, ":"), 1))*3600 + tonumber(mvindex(split(vpn_duration, ":"), 2))*60 + tonumber(mvindex(split(vpn_duration, ":"), 3)), null())), bytes_in=coalesce(bytes_in, if(match(vpn_rx_bytes, "^[\d.]+\s*[KMGTkmgt]?[Bb]$"), round(tonumber(replace(vpn_rx_bytes, "^([\d.]+).*$", "\1")) * pow(1024, case(match(vpn_rx_bytes, "(?i)TB$"), 4, match(vpn_rx_bytes, "(?i)GB$"), 3, match(vpn_rx_bytes, "(?i)MB$"), 2, match(vpn_rx_bytes, "(?i)KB$"), 1, 1=1, 0))), null())), bytes_out=coalesce(bytes_out, if(match(vpn_tx_bytes, "^[\d.]+\s*[KMGTkmgt]?[Bb]$"), round(tonumber(replace(vpn_tx_bytes, "^([\d.]+).*$", "\1")) * pow(1024, case(match(vpn_tx_bytes, "(?i)TB$"), 4, match(vpn_tx_bytes, "(?i)GB$"), 3, match(vpn_tx_bytes, "(?i)MB$"), 2, match(vpn_tx_bytes, "(?i)KB$"), 1, 1=1, 0))), null())), bytes=if(isnotnull(bytes_in) OR isnotnull(bytes_out), coalesce(bytes_in, 0) + coalesce(bytes_out, 0), null()), client_platform=coalesce(nullif(vpn_client_platform, "None"), "unknown"), client_version=coalesce(nullif(vpn_client_version, "None"), "unknown"), vpn_login=coalesce(vpn_session_login, vpn_login), session_id=user."|".dvc."|".coalesce(vpn_login, "")
iseval = 0

#############################################
# Dashboard Macros (app 2.2.0)
#############################################

[aviatrix_tunnel]
definition = `aviatrix_index` sourcetype="aviatrix:tunnel:status"
iseval = 0

# One event per DCF flow across L4 and L7. 8.2+ gateways log a session start
# and a session end for each L4 and L7 flow, and L7 adds TLS-check events;
# counting all of them would double count. Session-end events hold the byte
# counters and the inline IDS/IPS outcome, so search those separately.
[aviatrix_flows]
definition = `aviatrix_firewall` NOT session_event=1 NOT session_stage=end NOT reason=TLS_PROFILE
iseval = 0

# Traffic outcome as the SOC reads it:
#   Allowed       permitted by policy
#   Would block   matched a deny rule in monitor mode (logged, not dropped)
#   Blocked       dropped by an enforced deny rule
# outcome_key is the lower-case token value (allowed|monitor|blocked).
# Works with every TA release: vendor_action (TA >= 2.0.2) or raw action.
[aviatrix_outcome]
definition = eval vendor_verdict=lower(coalesce(vendor_action, action)), outcome=case(match(vendor_verdict, "^(deny|drop|block|blocked|reject)$") AND lower(enforced)=="false", "Would block", match(vendor_verdict, "^(deny|drop|block|blocked|reject)$"), "Blocked", 1=1, "Allowed"), outcome_key=case(outcome=="Blocked", "blocked", outcome=="Would block", "monitor", 1=1, "allowed")
iseval = 0

# Flow direction from the private/public split (RFC1918 + 100.64.0.0/10).
[aviatrix_direction]
definition = eval src_zone=if(`aviatrix_private_ip(src)`, "internal", "external"), dest_zone=if(`aviatrix_private_ip(dest)`, "internal", "external"), direction=case(src_zone=="internal" AND dest_zone=="internal", "East-west", src_zone=="internal", "Egress", 1=1, "Ingress")
iseval = 0

# Well-known service name for a destination port (null when not well known).
[aviatrix_service(1)]
args = port
definition = case(tonumber($port$)==22, "ssh", tonumber($port$)==25, "smtp", tonumber($port$)==53, "dns", tonumber($port$)==80, "http", tonumber($port$)==123, "ntp", tonumber($port$)==443, "https", tonumber($port$)==445, "smb", tonumber($port$)==1433, "mssql", tonumber($port$)==2379, "etcd", tonumber($port$)==3306, "mysql", tonumber($port$)==3389, "rdp", tonumber($port$)==5432, "postgres", tonumber($port$)==6379, "redis", tonumber($port$)==6443, "k8s-api", tonumber($port$)==8080, "http-alt", tonumber($port$)==8443, "https-alt", tonumber($port$)==9092, "kafka", tonumber($port$)==9200, "elasticsearch", tonumber($port$)==10250, "kubelet", tonumber($port$)==27017, "mongodb", tonumber($port$)==31337, "backdoor-31337", 1=1, null())
iseval = 0

[aviatrix_severity_label(1)]
args = sev
definition = case(tonumber($sev$)==1, "Critical", tonumber($sev$)==2, "High", tonumber($sev$)==3, "Medium", tonumber($sev$)==4, "Low", 1=1, "Info")
iseval = 0

# Threat events from both engines: Suricata IDS alerts and the 8.2+ L7 inline
# IDS/IPS verdicts logged on session-end events.
[aviatrix_threats]
definition = `aviatrix_index` ((sourcetype="aviatrix:ids" event_type="alert") OR (sourcetype="aviatrix:firewall:l7" (reason="IPS_POLICY_DENY" OR reason="IDS_POLICY_ALERT")))
iseval = 0

# Normalized threat fields. internal_host is the workload side of the alert
# (the private address), peer the other side, so investigations pivot on the
# asset whatever the alert direction. L7 inline events carry only a SID: an
# IPS drop is rated High, an alert Medium.
[aviatrix_threat_fields]
definition = eval engine=if(sourcetype=="aviatrix:ids", "Suricata IDS", "L7 inline IPS"), src=coalesce(src_ip, src), dest=coalesce(dest_ip, dest), sid=coalesce(signature_id, sid), severity_id=coalesce(severity_id, tonumber(severity), if(reason=="IPS_POLICY_DENY", 2, 3)), sev_label=`aviatrix_severity_label(severity_id)`, signature=coalesce(signature, "Suricata SID ".sid), category=coalesce(category, if(reason=="IPS_POLICY_DENY", "Blocked by L7 IPS", "L7 IDS alert")), threat_outcome=if(reason=="IPS_POLICY_DENY" OR lower(coalesce('alert.action', action))=="blocked", "Blocked", "Detected"), internal_host=case(`aviatrix_private_ip(src)` AND NOT `aviatrix_private_ip(dest)`, src, `aviatrix_private_ip(dest)`, dest, 1=1, src), peer=if(internal_host==src, dest, src), tactic=coalesce(mitre_tactic, replace(mvindex('alert.metadata.mitre_tactic_name{}', 0), "_", " "), "Unmapped"), domain=coalesce(sni_hostname, http_hostname, tls_sni, 'http.hostname', 'tls.sni')
iseval = 0

# Security-relevant audit categories (null for routine operations).
# Logging changes can be defense evasion; identity changes grant access.
[aviatrix_audit_risk]
definition = eval audit_risk=case(change_action=="read", null(), match(command, "(?i)rsyslog|syslog|log_?forward|netflow|cloudwatch|splunk|datadog|sumo|filebeat|log_export"), "Logging change", match(command, "(?i)user|account|saml|ldap|password|rbac|permission|api_token|mfa|duo|login"), "Identity change", match(command, "(?i)microseg|policy|app-domains|firenet|fqdn|egress|ids|ips|distributed|firewall|smart"), "Security policy change", 1=1, null()), controller=coalesce(dvc, if(match(host, "^%\{"), "unknown", host))
iseval = 0

#############################################
# Utility Macros
#############################################

[aviatrix_private_ip(1)]
args = field
definition = match($field$, "^10\.|^172\.(1[6-9]|2[0-9]|3[0-1])\.|^192\.168\.|^100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.")
iseval = 0

[aviatrix_duration_format(1)]
args = duration_seconds
definition = tostring($duration_seconds$, "duration")
iseval = 0

[aviatrix_bytes_format(1)]
args = bytes
definition = case($bytes$ >= 1073741824, round($bytes$/1073741824, 2)." GB", $bytes$ >= 1048576, round($bytes$/1048576, 2)." MB", $bytes$ >= 1024, round($bytes$/1024, 2)." KB", 1=1, $bytes$." B")
iseval = 0
