#
# Aviatrix Security - Search Macros
#

#############################################
# Base Data Access Macros
#############################################

[aviatrix_index]
definition = index=main
iseval = 0

[aviatrix_firewall]
definition = `aviatrix_index` (sourcetype="aviatrix:firewall:l4" OR sourcetype="aviatrix:firewall:l7" OR sourcetype="aviatrix:firewall:fqdn")
iseval = 0

[aviatrix_l4]
definition = `aviatrix_index` sourcetype="aviatrix:firewall:l4"
iseval = 0

[aviatrix_l7]
definition = `aviatrix_index` sourcetype="aviatrix:firewall:l7"
iseval = 0

[aviatrix_fqdn]
definition = `aviatrix_index` sourcetype="aviatrix:firewall:fqdn"
iseval = 0

[aviatrix_ids]
definition = `aviatrix_index` sourcetype="aviatrix:ids"
iseval = 0

[aviatrix_gateway_network]
definition = `aviatrix_index` sourcetype="aviatrix:gateway:network"
iseval = 0

[aviatrix_gateway_system]
definition = `aviatrix_index` sourcetype="aviatrix:gateway:system"
iseval = 0

[aviatrix_audit]
definition = `aviatrix_index` sourcetype="aviatrix:controller:audit"
iseval = 0

[aviatrix_vpn]
definition = `aviatrix_index` sourcetype="aviatrix:vpn:session"
iseval = 0

#############################################
# Filtered Macros
#############################################

[aviatrix_blocked]
definition = `aviatrix_firewall` (action="blocked" OR (action_cim="blocked" NOT vendor_action=*) OR action="DENY")
iseval = 0

[aviatrix_allowed]
definition = `aviatrix_firewall` (action="allowed" OR (action_cim="allowed" NOT vendor_action=*) OR action="PERMIT")
iseval = 0

[aviatrix_ids_alerts]
definition = `aviatrix_ids` event_type="alert"
iseval = 0

#############################################
# CIM-Compatible Macros
#############################################

[aviatrix_network_traffic]
definition = `aviatrix_firewall` | eval src=coalesce(src_ip, src, sip), dest=coalesce(dst_ip, dest, dip), action=`aviatrix_traffic_action`
iseval = 0

[aviatrix_intrusion_detection]
definition = `aviatrix_ids` event_type="alert" | eval src=src_ip, dest=dest_ip, vendor_product="Aviatrix IDS (Suricata)", ids_type="network", severity_id=coalesce(severity_id, tonumber(severity))
iseval = 0

# Traffic outcome (allowed|blocked) for an eval expression. TA >= 2.0.2 sets
# action to the CIM outcome (monitor-mode denies are allowed) and adds
# vendor_action; older TAs only have action_cim (L4/L7) or action (FQDN).
[aviatrix_traffic_action]
definition = if(isnotnull(vendor_action), action, coalesce(action_cim, action))
iseval = 0

# Normalized audit fields. TA >= 2.0.2: command = API name/URL, action = CIM verb.
# Older TAs: action is the API name and the verb is unknown.
[aviatrix_audit_fields]
definition = eval command=coalesce(command, action), change_action=if(isnotnull(vendor_action), action, "unknown"), object_category=coalesce(object_category, "unknown"), username=if(isnull(username) OR match(username, "^%\{"), "unknown", username), result_status=coalesce(result_status, if(result=="Success" OR match(result, "^2\d\d"), "success", "failure"))
iseval = 0

# Normalized User VPN session fields. TA >= 2.1.0 parses user, src, dest_ip,
# dvc, duration (seconds) and bytes_in/bytes_out (bytes) from the syslog line;
# with older TAs they are derived here from the connector's vpn_* strings.
# session_id ties a connect to its disconnect (same user, gateway and login time).
# vpn_status is active (connect) or disconnected.
[aviatrix_vpn_fields]
definition = eval vpn_status=lower(coalesce(vpn_session_status, vpn_status)), user=coalesce(user, if(isnull(vpn_user) OR match(vpn_user, "^(%\{.*|N/A)?$"), "unknown", vpn_user)), src=coalesce(src, if(match(vpn_public_ip, "^\d{1,3}(\.\d{1,3}){3}$"), vpn_public_ip, null())), dest_ip=coalesce(dest_ip, if(match(vpn_virtual_ip, "^\d{1,3}(\.\d{1,3}){3}$"), vpn_virtual_ip, null())), dvc=coalesce(dvc, vpn_gateway, host), duration=coalesce(duration, if(match(vpn_duration, "^\d+:\d+:\d+:\d+$"), tonumber(mvindex(split(vpn_duration, ":"), 0))*86400 + tonumber(mvindex(split(vpn_duration, ":"), 1))*3600 + tonumber(mvindex(split(vpn_duration, ":"), 2))*60 + tonumber(mvindex(split(vpn_duration, ":"), 3)), null())), bytes_in=coalesce(bytes_in, if(match(vpn_rx_bytes, "^[\d.]+\s*[KMGTkmgt]?[Bb]$"), round(tonumber(replace(vpn_rx_bytes, "^([\d.]+).*$", "\1")) * pow(1024, case(match(vpn_rx_bytes, "(?i)TB$"), 4, match(vpn_rx_bytes, "(?i)GB$"), 3, match(vpn_rx_bytes, "(?i)MB$"), 2, match(vpn_rx_bytes, "(?i)KB$"), 1, 1=1, 0))), null())), bytes_out=coalesce(bytes_out, if(match(vpn_tx_bytes, "^[\d.]+\s*[KMGTkmgt]?[Bb]$"), round(tonumber(replace(vpn_tx_bytes, "^([\d.]+).*$", "\1")) * pow(1024, case(match(vpn_tx_bytes, "(?i)TB$"), 4, match(vpn_tx_bytes, "(?i)GB$"), 3, match(vpn_tx_bytes, "(?i)MB$"), 2, match(vpn_tx_bytes, "(?i)KB$"), 1, 1=1, 0))), null())), bytes=if(isnotnull(bytes_in) OR isnotnull(bytes_out), coalesce(bytes_in, 0) + coalesce(bytes_out, 0), null()), client_platform=coalesce(nullif(vpn_client_platform, "None"), "unknown"), client_version=coalesce(nullif(vpn_client_version, "None"), "unknown"), vpn_login=coalesce(vpn_session_login, vpn_login), session_id=user."|".dvc."|".coalesce(vpn_login, "")
iseval = 0

#############################################
# Utility Macros
#############################################

[aviatrix_private_ip(1)]
args = field
definition = match($field$, "^10\.|^172\.(1[6-9]|2[0-9]|3[0-1])\.|^192\.168\.|^100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.")
iseval = 0

[aviatrix_duration_format(1)]
args = duration_seconds
definition = tostring($duration_seconds$, "duration")
iseval = 0

[aviatrix_bytes_format(1)]
args = bytes
definition = case($bytes$ >= 1073741824, round($bytes$/1073741824, 2)." GB", $bytes$ >= 1048576, round($bytes$/1048576, 2)." MB", $bytes$ >= 1024, round($bytes$/1024, 2)." KB", 1=1, $bytes$." B")
iseval = 0
